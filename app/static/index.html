<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MOMCC ServiceDesk</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232357d8'/%3E%3Cpath d='M8 9h16v14H8z' fill='none' stroke='white' stroke-width='2'/%3E%3Cpath d='M12 14h8m-8 4h5' stroke='white' stroke-width='2'/%3E%3C/svg%3E"><link rel="stylesheet" href="/static/style.css"></head><body>
<section id="login" class="login"><div class="brand">NCS / MOMCC</div><h1>ServiceDesk</h1><p>Sign in to report and manage faults.</p><form id="loginForm"><label>Email<input name="email" type="email" required autocomplete="username"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><button>Sign in</button></form></section>
<div id="app" hidden><aside><div class="brand">NCS / MOMCC</div><h2>ServiceDesk</h2><nav><button id="navTickets" class="active">Fault tickets</button><button id="navNotifications">Notifications <span id="unread"></span></button><button id="navReport">Monthly report</button><button id="navUsers">Users</button><button id="navAdmin">Admin</button></nav><div class="profile"><strong id="name"></strong><small id="role"></small><button id="logout">Sign out</button></div></aside><main><header><div><div class="eyebrow">OPERATIONS / FAULT MANAGEMENT</div><h1 id="heading">Fault tickets</h1></div><button id="newTicket">Report Issue</button></header><section id="ticketsView"><div id="stats" class="stats"></div><div class="toolbar"><input id="search" placeholder="Search reference, title or requester" aria-label="Search tickets"><select id="statusFilter" aria-label="Filter status"><option value="">All statuses</option><option>New</option><option>In Progress</option><option>On Hold</option><option value="Additional Information Requested">Pending Customer</option><option>Resolved, Pending Confirmation</option><option>Closed</option><option>Cancelled</option></select><button id="refresh" class="secondary">Refresh</button></div><div class="tablewrap"><table><thead><tr><th>Ticket / reported</th><th>Fault description</th><th>Requester</th><th>Severity</th><th>Status</th><th>Assigned to</th></tr></thead><tbody id="rows"></tbody></table><p id="empty" hidden>No tickets match this view.</p></div><div class="toolbar" id="pagination"><button id="prevPage" class="secondary">Previous</button><span id="pageInfo" aria-live="polite"></span><button id="nextPage" class="secondary">Next</button></div></section><section id="otherView" hidden></section></main></div>
<dialog id="createDialog"><form id="createForm"><div class="dialoghead"><h2>Report Issue</h2><button type="button" class="secondary" data-close="createDialog">Cancel</button></div><label>Category<select name="category"><option>Others</option><option>Amazon Connect</option><option>Agent desktop</option><option>Network / connectivity</option><option>Reset SharePoint/Knowledge Folder Password</option><option>Cisco voice / telephony</option></select></label><label>Subject<input name="title" minlength="3" maxlength="200" required></label><div class="grid"><label>Domain<select name="domain"><option>UAT</option><option>PROD</option><option>Corporate</option><option>Others</option></select></label></div><label>Severity<select name="severity"><option>Medium</option><option>Low</option><option>High</option><option>Critical</option></select></label><label>Description<textarea name="description" minlength="5" maxlength="20000" rows="5" placeholder="What happened? Include affected users, time, symptoms and steps to reproduce." required></textarea></label><label>Attachments (up to 5 files; 10 MB each, 20 MB total)<input name="files" type="file" multiple></label><button>Submit Fault Report</button></form></dialog>
<dialog id="detailDialog" class="detail"><div class="dialoghead"><div><div id="reference" class="eyebrow"></div><h2 id="detailTitle"></h2></div><button class="secondary" data-close="detailDialog">Close view</button></div><div id="detailMeta"></div><div id="description" class="description"></div><div id="ticketAttachments"></div><div id="resolution"></div><button id="deleteTicket" class="danger" hidden>Delete ticket</button><div class="tabs"><button data-tab="activity" class="secondary">Notes & history</button></div><div id="entries"></div><form id="actionForm"><h3>Update ticket</h3><div class="grid"><label id="actionLabel">Action<select id="action" name="action"></select></label><label id="assigneeLabel">Assign to<select id="assignee" name="assignee_id"></select></label></div><label id="severityLabel">Severity<select name="severity"><option>Medium</option><option>Low</option><option>High</option><option>Critical</option></select></label><label id="minutesLabel" hidden>Work duration (minutes)<input name="minutes" type="number" min="0" max="1440" value="0"></label><label><span id="commentLabel">Comment / reason / resolution</span><textarea name="text" rows="3" maxlength="20000"></textarea></label><label>Attachments (images, files or documents)<input name="files" type="file" multiple></label><button>Save & update</button></form></dialog><div id="toast" role="status" hidden></div><script src="/static/app.js"></script></body></html>
